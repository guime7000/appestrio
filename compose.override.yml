services:

  # Local dev only: docker compose auto-merges this file into every
  # `docker compose up`. Bind-mounts live source over what the image was
  # built with, so edits (e.g. a response schema) show up after a page
  # refresh with no rebuild. On the Pi / any real deploy, pin the base file
  # explicitly (`docker compose -f compose.yml up -d --build`) so this
  # override never applies there.
  backend:
    # compose.yml's own `volumes:` bind-mounts the audio folder from a
    # fixed host path, /home/pi/OhmFiles/audio (decided 2026-11-03, for
    # fleet homogenization) -- meaningless on a dev laptop, and Docker
    # would just create a stray /home/pi there. `!override` replaces
    # the whole list (same pattern as `devices:` below) with the named
    # volume (sqlite), the live-source bind, and a repo-local audio dir
    # instead.
    volumes: !override
      - app-db-data:/app/data
      - ./backend/app:/app/app
      - ./dev-data/audio:/app/data/audio
    command: ["fastapi", "run", "--reload"]
    # compose.yml's own `devices:` includes /dev/gpiochip0 for
    # app/services/relay.py -- unconditional there because every real
    # Pi has one, but a dev machine (this override's whole reason to
    # exist) isn't a Pi and almost certainly has no such device node,
    # which would otherwise make Docker refuse to start this container
    # at all (a missing `devices:` path is fatal at container start,
    # not a runtime no-op -- same lesson as lora-daemon's /dev/rtc0).
    # `!override` (a Compose merge-spec tag, v2.24+) replaces the base
    # list entirely rather than appending to it -- keeps /dev/snd
    # (works fine on a native-Linux dev machine's own sound card) but
    # drops /dev/gpiochip0. relay.py already degrades gracefully with
    # no GPIO device at all (logs a warning, no-ops) if you'd rather
    # just remove this whole key instead.
    devices: !override
      - /dev/snd:/dev/snd

  # Bind-mounts live source the same way, but there's no "--reload"
  # equivalent for this process -- restart the container after an edit
  # (`docker compose restart lora-daemon`). Note this container still
  # needs a real /run/e32.data to do anything useful; off the Pi, without
  # that socket, it starts and fails at transport.open() the same way
  # `uv run python -m lora_daemon` does locally -- see
  # Docs/Raspberry_Pi_Deployment.md.
  lora-daemon:
    volumes:
      - ./lora-daemon/lora_daemon:/app/lora_daemon

  # Same reasoning as `backend` above: compose.yml's own `volumes:`
  # points at /home/pi/OhmFiles/qlc, meaningless here. Restores the
  # repo's own committed sample show + fixtures
  # (`qlcplus/OhmQLCFiles/`) so local dev needs no host setup at all.
  qlcplus:
    volumes: !override
      - ./qlcplus/OhmQLCFiles:/QLC/project
      - ./qlcplus/OhmQLCFiles/fixtures:/root/.qlcplus/fixtures
