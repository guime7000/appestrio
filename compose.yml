services:

  backend:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SQLITE_PATH=/app/data/appestrio.db
      # Audio page uploads (main + test files) and the persisted
      # volume/file/loop state (app/services/audio_player.py) -- all
      # under the one bind-mounted folder below, same fixed host path
      # on every device (decided 2026-11-03, for fleet homogenization:
      # a known, predictable location independent of where this repo
      # happens to be checked out on a given Pi, not the sqlite
      # named volume's opaque Docker-managed storage).
      - AUDIO_DIR=/app/data/audio
      - AUDIO_STATE_PATH=/app/data/audio/audio_player_state.json
    volumes:
      - app-db-data:/app/data
      # /home/pi/OhmFiles/audio must exist on the host (Docker
      # auto-creates a missing bind-mount *directory*, confirmed --
      # unlike a missing device node, this is not fatal at container
      # start) -- see Docs/Raspberry_Pi_Deployment.md for the full
      # fleet directory layout.
      - /home/pi/OhmFiles/audio:/app/data/audio
    # mpv (app/services/audio_player.py) needs the host's sound card to
    # actually produce audio. Unconditional, unlike lora-daemon's
    # /dev/rtc0 below needing a device-tree overlay first: every
    # deployed Pi (master and every lumestrio) is the same hardware kit
    # and always has a sound card wired up (confirmed 2026-10-30) --
    # `handles_audio` only gates whether a device is *configured* to use
    # it in the actual show, a software/config decision, not whether the
    # hardware is physically capable.
    devices:
      - /dev/snd:/dev/snd
      # The relay that powers the audio amp (app/services/relay.py,
      # GPIO pin 25, ported from legacy's modules/Relay.ts) -- same
      # unconditional reasoning as /dev/snd above: one hardware kit,
      # every Pi has GPIO. gpiozero's `lgpio` backend talks to this
      # character device, not the older /dev/gpiomem. Pi-model-specific:
      # this is Pi 4 and earlier's path -- a Pi 5 (whose GPIO moved
      # behind the RP1 chip) needs /dev/gpiochip4 instead.
      - /dev/gpiochip0:/dev/gpiochip0
    build:
      context: .
      dockerfile: Dockerfile

  # Every lumestrio (and master) runs this unconditionally -- decided
  # 2026-11-03: appestrio's image should be generic/uniform, same as
  # mpv above, rather than needing a per-device opt-in overlay.
  # `handles_dmx` (DB config, not this service's presence) is what
  # actually gates whether `apply_active_state` starts anything in it
  # (app/services/dmx_player.py). This **supersedes** the 2026-11-01
  # decision to keep `qlcplus` in an opt-in `compose.dmx.yml` overlay
  # (that file no longer exists) -- that earlier reasoning was about a
  # physical DMX interface not being on every device, which is still
  # true and still handled below (the commented `devices:` placeholder),
  # but doesn't require the *software* to be opt-in too.
  qlcplus:
    build:
      context: ./qlcplus
    restart: always
    ports:
      # Reached directly by the browser on this port (App.vue's "QLC+"
      # nav link, gated by `handles_dmx` via GET /dmx/status) -- not
      # proxied through `backend`, same model as lora-daemon's own
      # hardware test console sitting directly on 8765.
      - "9999:9999"
    volumes:
      # Same fixed host path on every device as the audio folder above
      # (decided 2026-11-03). `/home/pi/OhmFiles/qlc` is mounted as a
      # whole *directory* (not a specific filename) -- qlcplus.sh's
      # entrypoint searches it for its one `.qxw` file at startup and
      # loads whichever is found, so the external partner's project
      # keeps its own real filename (no renaming to a fixed "qlc.qxw"
      # needed). Also sidesteps the earlier single-FILE-mount gotcha
      # entirely: a missing bind-mount *directory* just auto-creates
      # empty (confirmed harmless), unlike a missing *file* source,
      # which silently became an empty directory in its place and broke
      # loading -- no host prerequisite before the first `docker
      # compose up` anymore. `fixtures/` (QLC+'s own search path for
      # user fixtures, $HOME/.qlcplus/fixtures == /root/.qlcplus/fixtures
      # here) is mounted separately at its real target path.
      - /home/pi/OhmFiles/qlc:/QLC/project
      - /home/pi/OhmFiles/qlc/fixtures:/root/.qlcplus/fixtures
    # Add a real DMX interface's device node here once one is wired up
    # on this specific Pi -- still NOT universal across the fleet,
    # unlike the service itself above, e.g.:
    #   devices:
    #     - /dev/ttyUSB0:/dev/ttyUSB0

  lora-daemon:
    image: '${DOCKER_IMAGE_LORA_DAEMON?Variable not set}:${TAG-latest}'
    restart: always
    depends_on:
      - backend
    ports:
      # Exposes the control API's hardware test console
      # (http://<host>:8765/) to the LAN, not just other containers --
      # convenient for real-hardware bring-up testing. There's no auth on
      # these routes (they can pause the ping loop, trigger ACTIVATE,
      # etc.), so this is acceptable on a trusted local network during
      # bring-up but worth revisiting before any less-trusted deployment.
      - "8765:8765"
    environment:
      - LORA_DB_PATH=/app/data/appestrio.db
      # Reachable from `backend` over the compose network as
      # lora-daemon:8765 -- 127.0.0.1 (the code default) would only
      # accept connections from inside this same container.
      - LORA_CONTROL_HOST=0.0.0.0
      # Reverse channel (item 8 step 3): lora-daemon calls this device's
      # own `backend` container over the compose network when an
      # ACTIVATE frame arrives for our own address, so apply_active_state
      # can run. Default (backend_client.DEFAULT_BACKEND_URL) already
      # matches this value; set explicitly here for discoverability.
      - BACKEND_URL=http://backend:8000
    # SYNC's receive side (item 8's last gap, Docs/Lora_Daemon_To_Be_Done.md
    # §5): setting the system clock (`date -s`) and writing it through to
    # the physical RTC module on the GPIO pins (`hwclock --systohc`) both
    # need CAP_SYS_TIME -- the kernel gates `settimeofday` and the RTC
    # driver's RTC_SET_TIME ioctl on it identically. Without this grant,
    # lora_daemon/clock.py logs a warning and otherwise no-ops (it never
    # crashes the daemon over it), so this is required for SYNC to
    # actually take effect, not for the container to start at all.
    cap_add:
      - SYS_TIME
    devices:
      # The RTC module itself, passed through so `hwclock` can reach it.
      # Unlike the capability above, a MISSING device node here is fatal
      # at container start (Docker refuses to start, not a runtime
      # no-op) -- the module must already be wired up and recognized by
      # the kernel as /dev/rtc0 (a device-tree overlay enabling it, e.g.
      # `dtoverlay=i2c-rtc,ds3231` in /boot/firmware/config.txt, is a
      # host-level prerequisite, same spirit as e32.service below) before
      # this container will even boot.
      - /dev/rtc0:/dev/rtc0
    volumes:
      - app-db-data:/app/data
      # e32.service (the host-level LoRa/UART driver, see
      # Docs/Raspberry_Pi_Deployment.md) must already be running and have
      # created this socket file before this container starts, or Docker
      # will create an empty directory here instead and the daemon will
      # fail to reach it.
      - /run/e32.data:/run/e32.data
      # lora-daemon creates its OWN client socket here (transport.py's
      # LoraSocketTransport.open(), default /run/lora-daemon/client.sock)
      # so e32.service -- which runs on the host, not in a container --
      # can write delivery acks/replies back to it. Without this mount
      # that socket only exists inside this container's own /run, which
      # the host-level e32 process can't see: e32.service's own log shows
      # exactly this failure ("unable to send back status to unix socket
      # /run/lora-daemon/client.sock: ENOENT") -- outbound sends (e.g.
      # ACTIVATE) still work since /run/e32.data above is shared, but
      # nothing can ever be delivered back (PINGs appear to go
      # unanswered) until this directory is shared too.
      - /run/lora-daemon:/run/lora-daemon
    build:
      context: ./lora-daemon
      dockerfile: Dockerfile

volumes:
  app-db-data:
