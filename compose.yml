services:

  backend:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SQLITE_PATH=/app/data/appestrio.db
    volumes:
      - app-db-data:/app/data
    build:
      context: backend
      dockerfile: Dockerfile

volumes:
  app-db-data:
