[project]
name = "lora-daemon"
version = "0.1.0"
description = "Python port of raspestrio's LoRa control layer, for appestrio"
requires-python = ">=3.14,<4.0"
dependencies = []

[dependency-groups]
dev = [
    "pytest<10.0.0,>=7.4.3",
    "ruff<1.0.0,>=0.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
]
